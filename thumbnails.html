<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Thumbnails — PHMR</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080B;--s1:#0F1115;--s2:#171A21;--line:#242832;--tx:#EDEEF2;--mu:#8A90A0;--ac:#8B7CFF;--ac2:#C4BDFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.6 'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:italic;color:var(--ac2)}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.035em;line-height:1}

/* ambient glow */
body::before{content:"";position:fixed;inset:-20% -10% auto;height:70vh;background:radial-gradient(50% 50% at 50% 0,rgba(139,124,255,.22),transparent 70%);pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:14px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;background:rgba(15,17,21,.7);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:9px 12px 9px 22px;max-width:900px}
.logo{font-weight:700;text-decoration:none}
nav{display:flex;gap:24px;align-items:center}nav a{text-decoration:none;color:var(--mu);font-size:15px;transition:color .2s}nav a:hover{color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--tx);color:#07080B;font:700 15px 'Space Grotesk';padding:12px 22px;border-radius:999px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,124,255,.4)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ac);box-shadow:none}
nav .btn{padding:9px 18px}

/* hero */
.hero{padding:90px 0 40px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--s1);border-radius:99px;padding:6px 16px;font-size:14px;color:var(--mu)}
.pill i{width:8px;height:8px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.hero h1{font-size:clamp(46px,9vw,118px);margin:26px auto 0;max-width:11em}
.hero h1 span{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.hero h1 span>b{display:inline-block;font-weight:500}
.hero p{color:var(--mu);font-size:20px;max-width:46ch;margin:26px auto 34px}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
 .hero h1 span>b{animation:up .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*90ms)}
 .hero .pill,.hero p,.hero .cta{animation:fade 1s .5s backwards}
 @keyframes up{from{transform:translateY(110%)}}@keyframes fade{from{opacity:0;transform:translateY(12px)}}
 .rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
}

/* marquee */
.mq{margin:70px 0 0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq .tr{display:flex;gap:16px;width:max-content}
.mq .th{width:300px;flex:none}
@media (prefers-reduced-motion:no-preference){.mq .tr{animation:mq 40s linear infinite}.mq:hover .tr{animation-play-state:paused}}
@keyframes mq{to{transform:translateX(calc(-50% - 8px))}}

/* thumbnails */
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--g);border:1px solid var(--line);isolation:isolate}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th::before{content:"";position:absolute;width:60%;aspect-ratio:1;border-radius:50%;right:-12%;bottom:-30%;background:var(--c);filter:blur(30px);opacity:.75;z-index:-1}
.th b{position:absolute;left:6%;bottom:9%;max-width:70%;font:700 clamp(18px,2.8vw,32px)/.95 'Space Grotesk';text-transform:uppercase;letter-spacing:-.02em;-webkit-text-stroke:4px #000;paint-order:stroke fill}
.a{--g:linear-gradient(145deg,#1B1740,#0C0B1C);--c:#8B7CFF}
.b{--g:linear-gradient(145deg,#2B1410,#120807);--c:#FF6B3D}
.c{--g:linear-gradient(145deg,#0E2A22,#07120E);--c:#3DDC97}
.d{--g:linear-gradient(145deg,#2A1020,#12060E);--c:#FF4D8D}
.e{--g:linear-gradient(145deg,#10202E,#070E14);--c:#3DB8FF}

section{padding:100px 0 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
h2{font-size:clamp(36px,5.6vw,68px)}
.sub{color:var(--mu);max-width:44ch;margin:12px 0 0}

/* cards w/ tilt + spotlight */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;perspective:1100px}
.card{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px;transition:transform .25s ease-out,border-color .3s;transform-style:preserve-3d;will-change:transform}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(139,124,255,.18),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{border-color:#3A3F4E}.card:hover::after{opacity:1}
.card.wide{grid-column:span 2}
.card p{margin:12px 6px 4px;display:flex;justify-content:space-between;font-size:15px}.card p span{color:var(--mu)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:28px}
.stat b{display:block;font-size:clamp(40px,5vw,60px);font-weight:500;letter-spacing:-.04em;line-height:1}
.stat span{color:var(--mu);font-size:15px}

/* process */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:30px;position:relative;overflow:hidden}
.step::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,var(--ac),transparent);transform:scaleX(0);transform-origin:left;transition:transform 1.2s .2s}
.step.in::before{transform:scaleX(1)}
.step small{color:var(--ac2);font-weight:700}.step h3{font-size:26px;margin:14px 0 8px}.step p{color:var(--mu);margin:0}

/* faq */
.faq{max-width:760px;margin:0 auto}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;font-size:20px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--ac2);font-size:26px;line-height:1;transition:transform .3s}
details[open] summary::after{transform:rotate(135deg)}
details p{color:var(--mu);margin:12px 0 0}

/* contact */
.cta2{margin-top:100px;text-align:center;border:1px solid var(--line);border-radius:32px;padding:clamp(40px,8vw,100px) 24px;background:radial-gradient(60% 90% at 50% 120%,rgba(139,124,255,.3),transparent 70%),var(--s1)}
.cta2 h2{font-size:clamp(40px,7vw,92px);max-width:11em;margin:0 auto 28px}
footer{padding:44px 0;color:var(--mu);font-size:15px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

@media (max-width:860px){.grid,.steps{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.card.wide{grid-column:span 2}nav a:not(.btn){display:none}}
@media (max-width:560px){.grid,.steps{grid-template-columns:1fr}.card.wide{grid-column:auto}section{padding-top:70px}}

nav a[aria-current]{color:var(--tx)}
.rows{margin-top:60px;display:grid;gap:16px}
.rows .mq{margin:0}
.mq .th{width:clamp(220px,26vw,340px)}
.more{text-align:center;margin-top:40px}
@media (prefers-reduced-motion:no-preference){.mq .tr{animation-duration:var(--t,40s)}.mq.rev .tr{animation-direction:reverse}}
.pg{padding:70px 0 10px}
.pg h1{font-size:clamp(44px,8vw,96px)}
.pg p{color:var(--mu);margin:14px 0 0;max-width:44ch}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0 0}
.tile{padding:0;border:0;background:none;cursor:zoom-in;border-radius:14px;transition:transform .3s,box-shadow .3s;color:inherit}
.tile:hover{transform:translateY(-5px);box-shadow:0 14px 40px rgba(139,124,255,.25)}
@media (prefers-reduced-motion:no-preference){.tile{animation:fade .7s calc(var(--i)*50ms) backwards}}
.lb{position:fixed;inset:0;background:rgba(5,6,9,.94);display:grid;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
.lb[hidden]{display:none}
.lb img{max-width:94vw;max-height:88vh;border-radius:12px}
@media (max-width:860px){.gal{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.gal{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html">RAVIO.</a><nav><a href="index.html">Home</a><a href="thumbnails.html" aria-current="page">Thumbnails</a><a href="index.html#process">Process</a><a href="index.html#faq">FAQ</a><a class="btn" href="index.html#contact">Get started</a></nav></div></header>

<main id="top">
<div class="wrap pg"><h1>All <span class="serif">thumbnails</span></h1><p>Every thumbnail I designed. Click an image to see it bigger.</p></div>
<div class="wrap"><div class="gal" id="gal"></div></div>
</main>
<div class="lb" id="lb" hidden><img alt=""></div>
<div class="wrap"><footer><span>© 2026 Zayd. Thumbnail designer.</span><span><a href="#">Instagram</a> · <a href="#">X</a> · <a href="#">Behance</a></span></footer></div>
<script src="works.js"></script>
<script>
const gal=document.getElementById('gal'),lb=document.getElementById('lb'),lbi=lb.querySelector('img');
gal.innerHTML=works.map((src,i)=>`<button class="tile" style="--i:${i}" data-src="${src}" aria-label="Open thumbnail ${i+1}"><div class="th"><img src="${src}" alt="Thumbnail design ${i+1}" loading="lazy"></div></button>`).join('');
gal.addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;lbi.src=b.dataset.src;lb.hidden=false});
lb.addEventListener('click',()=>lb.hidden=true);
addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
</script>
</body>
</html>
